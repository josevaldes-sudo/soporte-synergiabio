<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte SynergiaBio | Portal de Tickets</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="font-sans antialiased">

    <div class="container mx-auto px-4 py-16">
        <div class="max-w-2xl mx-auto glass-card rounded-[2rem] shadow-2xl p-8 md:p-12 border border-gray-100">
            
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-slate-900 text-white rounded-2xl mb-4 shadow-lg">
                    <i class="fas fa-headset text-2xl"></i>
                </div>
                <h2 class="text-3xl font-black text-slate-800 uppercase tracking-tighter">Nuevo Ticket</h2>
                <p class="text-slate-500 font-medium mt-2">SynergiaBio Support System</p>
            </div>

            <form action="https://synergiabio.soportesynergiabio.workers.dev" method="POST" id="form">

                <input type="hidden" name="from_name" value="Portal de Soporte SynergiaBio">
                <input type="hidden" name="redirect" value="https://josevaldes-sudo.github.io/soporte-synergiabio/gracias.html">
                
                <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Nombre Completo</label>
                        <input type="text" name="name" required placeholder="Ej. Juan Pérez"
                        class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500 focus:bg-white transition-all text-slate-700">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Correo Electrónico</label>
                        <input type="email" name="email" required placeholder="usuario@empresa.com"
                        class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500 focus:bg-white transition-all text-slate-700">
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Asunto del Problema</label>
                    <input type="text" name="subject" required placeholder="¿En qué podemos ayudarte?"
                    class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500 focus:bg-white transition-all text-slate-700 font-semibold">
                </div>

                <div class="mb-8">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Descripción Detallada</label>
                    <textarea name="message" required rows="5" placeholder="Describe el error o solicitud aquí..."
                    class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500 focus:bg-white transition-all text-slate-700"></textarea>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-slate-900 hover:bg-blue-600 text-white font-black py-5 rounded-2xl shadow-xl shadow-blue-100 transition-all flex items-center justify-center text-lg group">
                    <span id="btn-text" class="flex items-center">
                        <i class="fas fa-paper-plane mr-3 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i> 
                        ENVIAR TICKET AHORA
                    </span>
                </button>

            </form>

            <div class="mt-8 pt-8 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-400 font-bold uppercase tracking-widest">Seguridad Protegida por Cloudflare</p>
            </div>

        </div>
    </div>

    <script>
        // Efecto visual al enviar para mejorar la experiencia del usuario
        const form = document.getElementById('form');
        const btn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');

        form.addEventListener('submit', function() {
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';
            btnText.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-3"></i> PROCESANDO...';
        });
    </script>

</body>
</html>
