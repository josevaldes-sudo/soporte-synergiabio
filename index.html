<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte SynergiaBio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans p-4">
    <div class="max-w-xl mx-auto bg-white rounded-3xl shadow-xl p-8 mt-10">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-black text-slate-800 uppercase">Nuevo Ticket</h2>
        </div>

        <form id="form">
            <div class="space-y-4">
                <input type="text" name="name" required placeholder="Nombre" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500">
                <input type="email" name="email" required placeholder="Correo" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500">
                <input type="text" name="subject" required placeholder="Asunto" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500">
                <textarea name="message" required rows="4" placeholder="Descripción..." class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500"></textarea>
                
                <button type="submit" id="btn" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:bg-blue-600 transition-all">
                    ENVIAR TICKET
                </button>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('form');
        const btn = document.getElementById('btn');
        // URL de tu worker (verificada en image_85801c.png)
        const WORKER_URL = 'https://synergiabio.soportesynergiabio.workers.dev';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerText = "PROCESANDO...";

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    body: new FormData(form)
                });

                const result = await response.json();

                if (result.success) {
                    window.location.href = "https://josevaldes-sudo.github.io/soporte-synergiabio/gracias.html";
                } else {
                    alert("Error: " + result.message);
                    reset();
                }
            } catch (err) {
                alert("Error de conexión. Revisa que la Worker esté publicada.");
                reset();
            }
        });

        function reset() {
            btn.disabled = false;
            btn.innerText = "REINTENTAR";
        }
    </script>
</body>
</html>
