<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte SynergiaBio | Tickets</title>
    
    <meta name="robots" content="noindex, nofollow">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-slate-900 p-4 shadow-xl">
        <div class="container mx-auto">
            <h1 class="text-white text-xl font-bold flex items-center">
                <i class="fas fa-shield-alt mr-2 text-blue-400"></i>
                SynergiaBio <span class="font-light text-gray-400 ml-2">Soporte</span>
            </h1>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-12">
        <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-2xl p-10 border border-gray-200">
            
            <div class="text-center mb-10">
                <h2 class="text-3xl font-black text-slate-800 uppercase tracking-tighter">Nuevo Ticket</h2>
                <p class="text-gray-400">Complete los detalles para procesar su solicitud</p>
            </div>

            <form action="https://api.web3forms.com/submit" method="POST" id="form">

                <input type="hidden" name="access_key" value="a017b9d0-c04a-44ba-ba32-ef174d5192e7">
                <input type="hidden" name="from_name" value="Portal de Soporte">
                <input type="hidden" name="redirect" value="https://josevaldes-sudo.github.io/soporte-synergiabio/gracias.html">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-xs font-black text-slate-500 uppercase mb-2">Nombre</label>
                        <input type="text" name="name" required placeholder="Juan Pérez" 
                        class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-xl outline-none focus:border-blue-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-black text-slate-500 uppercase mb-2">Correo</label>
                        <input type="email" name="email" required placeholder="correo@empresa.com" 
                        class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-xl outline-none focus:border-blue-500 transition-all">
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-xs font-black text-slate-500 uppercase mb-2">Asunto / Encabezado del Problema</label>
                    <input type="text" name="subject" required placeholder="Ej: se atasco el papel en la impresora" 
                    class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-xl outline-none focus:border-blue-500 transition-all font-bold text-slate-700">
                </div>

                <div class="mb-8">
                    <label class="block text-xs font-black text-slate-500 uppercase mb-2">Descripción del Incidente</label>
                    <textarea name="message" required rows="4" placeholder="Describa brevemente qué sucede..." 
                    class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-xl outline-none focus:border-blue-500 transition-all"></textarea>
                </div>

                <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                <button type="submit" id="submit-btn"
                class="w-full bg-slate-900 hover:bg-blue-600 text-white font-black py-5 rounded-2xl shadow-lg transition-all flex items-center justify-center text-lg tracking-widest">
                    <i class="fas fa-paper-plane mr-3"></i> ENVIAR TICKET
                </button>
            </form>
        </div>
        
        <p class="text-center mt-8 text-gray-400 text-sm">
            &copy; 2026 SynergiaBio - Uso exclusivo para personal autorizado
        </p>
    </div>

    <script>
        const form = document.getElementById('form');
        const btn = document.getElementById('submit-btn');

        form.addEventListener('submit', function() {
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-3"></i> ENVIANDO...';
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';
        });
    </script>

</body>
</html>
