<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte SynergiaBio | Portal de Tickets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans">

    <div class="container mx-auto px-4 py-16">
        <div class="max-w-2xl mx-auto bg-white rounded-[2rem] shadow-2xl p-8 md:p-12 border border-slate-100">
            
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-slate-900 text-white rounded-2xl mb-4 shadow-lg">
                    <i class="fas fa-headset text-2xl"></i>
                </div>
                <h2 class="text-3xl font-black text-slate-800 uppercase tracking-tighter">Nuevo Ticket</h2>
                <p class="text-slate-500 font-medium">SynergiaBio Support System</p>
            </div>

            <form action="https://synergiabio.soportesynergiabio.workers.dev" method="POST" id="form">

                <input type="hidden" name="from_name" value="Portal de Soporte SynergiaBio">
                <input type="hidden" name="redirect" value="https://josevaldes-sudo.github.io/soporte-synergiabio/gracias.html">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Nombre</label>
                        <input type="text" name="name" required placeholder="Juan Pérez"
                        class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Correo</label>
                        <input type="email" name="email" required placeholder="usuario@empresa.com"
                        class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500 transition-all">
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Asunto</label>
                    <input type="text" name="subject" required placeholder="Asunto del problema"
                    class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500 transition-all font-semibold">
                </div>

                <div class="mb-8">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Descripción</label>
                    <textarea name="message" required rows="5" placeholder="Describa su solicitud..."
                    class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500 transition-all"></textarea>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-slate-900 hover:bg-blue-600 text-white font-black py-5 rounded-2xl shadow-xl transition-all flex items-center justify-center text-lg">
                    <span id="btn-text"><i class="fas fa-paper-plane mr-3"></i> ENVIAR TICKET</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('form');
        const btn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');

        form.addEventListener('submit', async function(e) {
            e.preventDefault(); // Evitamos el envío clásico para que no falle
            
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';
            btnText.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-3"></i> ENVIANDO...';

            const formData = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    mode: 'cors'
                });

                const result = await response.json();

                if (result.success) {
                    window.location.href = form.redirect.value;
                } else {
                    alert('Error: ' + (result.message || 'No se pudo enviar'));
                    btn.style.opacity = '1';
                    btn.style.pointerEvents = 'auto';
                    btnText.innerHTML = '<i class="fas fa-paper-plane mr-3"></i> REINTENTAR';
                }
            } catch (error) {
                console.error(error);
                alert('Error de conexión con el servidor de seguridad.');
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
                btnText.innerHTML = '<i class="fas fa-paper-plane mr-3"></i> REINTENTAR';
            }
        });
    </script>
</body>
</html>
