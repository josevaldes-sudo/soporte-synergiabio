<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte SynergiaBio | Tickets Rápidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans">

    <nav class="bg-slate-800 p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-white text-xl font-bold flex items-center">
                <i class="fas fa-life-ring mr-2 text-blue-400"></i>
                SynergiaBio <span class="font-light text-gray-300 ml-2 italic">Soporte</span>
            </h1>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-12">
        <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-2xl p-8 border border-gray-100">

            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold text-slate-800">Crear Ticket de Soporte</h2>
            </div>

            <form action="https://api.web3forms.com/submit" method="POST" id="form">

                <input type="hidden" name="access_key" value="a017b9d0-c04a-44ba-ba32-ef174d5192e7">
                <input type="hidden" name="from_name" value="Portal de Soporte SynergiaBio">
                <input type="hidden" name="redirect" value="http://100.73.182.60:9020/gracias.html">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Tu Nombre</label>
                        <input type="text" name="name" required placeholder="Juan Pérez"
                        class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Tu Correo</label>
                        <input type="email" name="email" required placeholder="correo@empresa.com"
                        class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Asunto / Resumen del Problema</label>
                    <input type="text" name="subject" required placeholder="Ej: No funciona la VPN / Error en Zabbix"
                    class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 font-semibold">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Descripción detallada</label>
                    <textarea name="message" required rows="5" placeholder="Cuéntanos más sobre el incidente..."
                    class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                <button type="submit"
                class="w-full bg-slate-800 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all flex items-center justify-center text-lg">
                    <i class="fas fa-paper-plane mr-2"></i> ENVIAR TICKET
                </button>
            </form>
        </div>
    </div>

</body>
</html>
