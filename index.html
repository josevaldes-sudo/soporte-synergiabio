<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Soporte SynergiaBio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-8">
    <div class="max-w-xl mx-auto bg-white p-8 rounded-3xl shadow-lg">
        <h2 class="text-2xl font-black text-center mb-6 uppercase">Nuevo Ticket</h2>
        
        <form id="form" action="https://synergiabio.soportesynergiabio.workers.dev" method="POST">
            <div class="space-y-4">
                <input type="text" name="name" required placeholder="Nombre" class="w-full p-4 bg-slate-50 border rounded-xl">
                <input type="email" name="email" required placeholder="Correo" class="w-full p-4 bg-slate-50 border rounded-xl">
                <input type="text" name="subject" required placeholder="Asunto" class="w-full p-4 bg-slate-50 border rounded-xl">
                <textarea name="message" required placeholder="Mensaje..." class="w-full p-4 bg-slate-50 border rounded-xl" rows="4"></textarea>
                
                <button type="submit" id="btn" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl">
                    ENVIAR TICKET
                </button>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('form');
        const btn = document.getElementById('btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerText = "ENVIANDO...";

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form)
                });

                // Si la respuesta es exitosa (aunque no sea JSON perfecto)
                if (response.ok) {
                    window.location.href = "https://josevaldes-sudo.github.io/soporte-synergiabio/gracias.html";
                } else {
                    const errorData = await response.text();
                    console.error("Error original:", errorData);
                    alert("Error en el envío. Inténtalo de nuevo en unos minutos.");
                    reset();
                }
            } catch (err) {
                alert("Error de conexión con el servidor de seguridad.");
                reset();
            }
        });

        function reset() {
            btn.disabled = false;
            btn.innerText = "REINTENTAR";
        }
    </script>
</body>
</html>
