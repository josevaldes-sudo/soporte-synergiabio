
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynergiaBio - Crear Ticket de Soporte</title>
    <style>
        :root {
            --primary: #2d6a4f;
            --primary-light: #52b788;
            --primary-dark: #1b4332;
            --bg: #f0f4f1;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text: #1a1a1a;
            --text-muted: #6b7280;
            --border: #d1d5db;
            --error: #dc2626;
            --focus-ring: rgba(82, 183, 136, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(160deg, #e8f5e9 0%, #f0f4f1 50%, #e0f2f1 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
        }

        /* ===== HOJAS CAYENDO ===== */
        .falling-leaves {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .leaf {
            position: absolute;
            top: -10%;
            font-size: 1.5rem;
            opacity: 0.18;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.2; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* ===== TARJETA PRINCIPAL ===== */
        .card {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 35px rgba(45, 106, 79, 0.15);
            backdrop-filter: blur(10px);
            z-index: 10;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .header {
            background: linear-gradient(135deg, var(--primary), #40916c);
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
        }

        .header h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; }
        .header p { font-size: 0.85rem; opacity: 0.9; margin-top: 0.4rem; }

        .form { padding: 2rem; }
        .form-group { margin-bottom: 1.25rem; }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.9rem 1.1rem;
            border: 2px solid #edf2ef;
            border-radius: 14px;
            font-size: 0.95rem;
            background: #f9fbf9;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-light);
            background: white;
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .btn {
            width: 100%;
            padding: 1.1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(45, 106, 79, 0.2);
        }

        .btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }

        .footer { margin-top: 2rem; color: #94a3b8; font-size: 0.75rem; font-weight: 600; }
    </style>
</head>
<body>

    <div class="falling-leaves" id="leaf-container"></div>

    <div class="card">
        <div class="header">
            <h1>🌿 SynergiaBio</h1>
            <p>Portal de Soporte Técnico</p>
        </div>

        <form class="form" action="https://api.web3forms.com/submit" method="POST">
            
            <input type="hidden" name="access_key" value="a017b9d0-c04a-44ba-ba32-ef174d5192e7">
            
            <input type="hidden" name="from_name" value="Portal de Soporte">
           
            <input type="hidden" name="redirect" value="https://josevaldes-sudo.github.io/soporte-synergiabio/gracias.html">
            
            <div class="form-group">
                <label>Tu Nombre</label>
                <input type="text" name="name" required placeholder="Ej. Juan Pérez">
            </div>

            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" name="email" required placeholder="ejemplo@synergiabio.com">
            </div>

            <div class="form-group">
                <label>Asunto</label>
                <input type="text" name="subject" required placeholder="¿En qué podemos ayudarte?">
            </div>

            <div class="form-group">
                <label>Mensaje / Descripción</label>
                <textarea name="message" required rows="4" placeholder="Describe el problema o solicitud..."></textarea>
            </div>

            <button type="submit" class="btn">Enviar Ticket</button>
        </form>
    </div>

    <div class="footer">© 2026 SYNERGIABIO — SOPORTE TI</div>

    <script>
        // Generador de hojas
        (function createLeaves() {
            const container = document.getElementById('leaf-container');
            const symbols = ['🍃', '🌿', '🌱'];
            for (let i = 0; i < 20; i++) {
                const leaf = document.createElement('div');
                leaf.classList.add('leaf');
                leaf.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                leaf.style.left = `${Math.random() * 100}vw`;
                leaf.style.animationDuration = `${10 + Math.random() * 15}s`;
                leaf.style.animationDelay = `-${Math.random() * 20}s`;
                container.appendChild(leaf);
            }
        })();
    </script>
</body>
</html>
