<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SynergiaBIO · Ticket Recibido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #060a14;
  --bg-mid: #0d1220;
  --bg-card: rgba(255, 255, 255, 0.04);
  --border-glass: rgba(255, 255, 255, 0.08);
  --neon-green: #00ff88;
  --neon-cyan: #00d4ff;
  --neon-pink: #ff6b9d;
  --neon-gold: #ffd700;
  --neon-purple: #a855f7;
  --text-primary: #ffffff;
  --text-muted: #8b95a8;
  --text-dim: #5a6478;
  --error: #ff4757;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  -webkit-font-smoothing: antialiased;
}

/* ============ ANIMATED BACKGROUND ============ */
.bg-aurora {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: radial-gradient(ellipse at top, #0d1220 0%, #060a14 100%);
}

.aurora-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.5;
  animation: blobFloat 20s ease-in-out infinite;
}

.aurora-blob:nth-child(1) { width: 500px; height: 500px; background: radial-gradient(circle, #00ff88 0%, transparent 70%); top: -10%; left: -10%; animation-duration: 25s; }
.aurora-blob:nth-child(2) { width: 600px; height: 600px; background: radial-gradient(circle, #00d4ff 0%, transparent 70%); top: 40%; right: -15%; animation-duration: 30s; animation-delay: -5s; }
.aurora-blob:nth-child(3) { width: 450px; height: 450px; background: radial-gradient(circle, #a855f7 0%, transparent 70%); bottom: -10%; left: 30%; animation-duration: 22s; animation-delay: -10s; }
.aurora-blob:nth-child(4) { width: 400px; height: 400px; background: radial-gradient(circle, #ff6b9d 0%, transparent 70%); top: 20%; left: 50%; animation-duration: 28s; animation-delay: -15s; opacity: 0.3; }

@keyframes blobFloat {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(50px, -30px) scale(1.1); }
  66% { transform: translate(-30px, 40px) scale(0.95); }
}

.grid-overlay {
  position: fixed;
  inset: 0;
  background-image: 
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 60px 60px;
  z-index: 1;
  pointer-events: none;
  mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
}

.fireflies { position: fixed; inset: 0; z-index: 2; pointer-events: none; }

.firefly {
  position: absolute;
  width: 4px;
  height: 4px;
  background: var(--neon-green);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-green);
  animation: fireflyFloat 15s ease-in-out infinite;
}

.firefly::after {
  content: '';
  position: absolute;
  inset: -4px;
  background: inherit;
  border-radius: 50%;
  opacity: 0.3;
  filter: blur(4px);
}

@keyframes fireflyFloat {
  0%, 100% { transform: translate(0, 0); opacity: 0; }
  10%, 90% { opacity: 1; }
  25% { transform: translate(100px, -150px); }
  50% { transform: translate(-80px, -300px); }
  75% { transform: translate(150px, -200px); }
}

/* ============ HEADER ============ */
header {
  position: relative;
  z-index: 100;
  padding: 1.2rem 2rem;
  backdrop-filter: blur(20px);
  background: rgba(6, 10, 20, 0.6);
  border-bottom: 1px solid var(--border-glass);
  animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideDown {
  from { transform: translateY(-100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.header-content {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.logo-container { display: flex; align-items: center; gap: 0.8rem; position: relative; }

.logo-img {
  height: 46px;
  width: auto;
  filter: brightness(1.1);
  transition: transform 0.3s ease;
}

.logo-img:hover { transform: scale(1.05); }

.logo-glow {
  position: absolute;
  width: 220px;
  height: 90px;
  background: radial-gradient(ellipse, rgba(0, 255, 136, 0.2), transparent 70%);
  filter: blur(20px);
  pointer-events: none;
  animation: logoPulse 3s ease-in-out infinite;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

@keyframes logoPulse {
  0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.15); }
}

.support-btn {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.55rem 1.1rem;
  background: linear-gradient(135deg, rgba(0, 255, 136, 0.15), rgba(0, 212, 255, 0.15));
  border: 1px solid rgba(0, 255, 136, 0.3);
  border-radius: 100px;
  color: var(--neon-green);
  font-weight: 600;
  font-size: 0.88rem;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
  font-family: inherit;
  white-space: nowrap;
  flex-shrink: 0;
  animation: gentleNudge 2s ease-in-out infinite;
}

@keyframes gentleNudge {
  0%, 85%, 100% { transform: translateX(0); }
  88% { transform: translateX(2px); }
  91% { transform: translateX(-2px); }
  94% { transform: translateX(1.5px); }
  97% { transform: translateX(-1px); }
}

.support-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
  opacity: 0;
  transition: opacity 0.4s ease;
  z-index: 0;
}

.support-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
  border-color: var(--neon-green);
  color: var(--bg-deep);
  animation: none;
}

.support-btn:hover::before { opacity: 1; }

.support-btn svg, .support-btn span { position: relative; z-index: 1; }
.support-btn svg { animation: pulse 2s ease-in-out infinite; }

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

/* ============ SUPPORT PANEL ============ */
.support-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: all 0.4s ease;
}

.support-overlay.active { opacity: 1; visibility: visible; }

.support-panel {
  position: fixed;
  top: 100px;
  right: 2rem;
  width: 340px;
  background: rgba(13, 18, 32, 0.95);
  backdrop-filter: blur(30px);
  border: 1px solid var(--border-glass);
  border-radius: 24px;
  padding: 1.8rem;
  z-index: 1001;
  transform: translateY(-20px) scale(0.95);
  opacity: 0;
  visibility: hidden;
  transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
}

.support-panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan), var(--neon-purple));
  border-radius: 24px 24px 0 0;
}

.support-panel.active { transform: translateY(0) scale(1); opacity: 1; visibility: visible; }

.support-panel-header {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border-glass);
}

.support-panel-header .icon-circle {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 20px rgba(0, 255, 136, 0.3);
  animation: iconPulse 2s ease-in-out infinite;
}

@keyframes iconPulse {
  0%, 100% { box-shadow: 0 8px 20px rgba(0, 255, 136, 0.3); }
  50% { box-shadow: 0 8px 30px rgba(0, 255, 136, 0.6); }
}

.support-panel-header h3 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.2rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--text-primary), var(--neon-green));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.contact-item {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem;
  margin-bottom: 0.7rem;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-glass);
  border-radius: 14px;
  text-decoration: none;
  color: inherit;
  transition: all 0.3s ease;
  animation: slideIn 0.5s ease-out both;
}

.contact-item:nth-child(1) { animation-delay: 0.1s; }
.contact-item:nth-child(2) { animation-delay: 0.2s; }

@keyframes slideIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

.contact-item:hover {
  background: rgba(0, 255, 136, 0.08);
  border-color: rgba(0, 255, 136, 0.3);
  transform: translateX(5px);
}

.contact-icon {
  width: 42px;
  height: 42px;
  background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 212, 255, 0.2));
  border: 1px solid rgba(0, 255, 136, 0.3);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.3s ease;
}

.contact-item:hover .contact-icon {
  transform: rotate(8deg) scale(1.1);
  background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
}

.contact-icon svg {
  width: 20px;
  height: 20px;
  stroke: var(--neon-green);
  transition: stroke 0.3s ease;
}

.contact-item:hover .contact-icon svg { stroke: var(--bg-deep); }

.contact-info { flex: 1; min-width: 0; }

.contact-label {
  font-size: 0.7rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
  margin-bottom: 0.2rem;
}

.contact-value {
  font-size: 0.9rem;
  color: var(--text-primary);
  font-weight: 600;
  word-break: break-all;
}

.close-panel {
  position: absolute;
  top: 1rem;
  right: 1rem;
  width: 32px;
  height: 32px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-glass);
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 1rem;
  transition: all 0.3s ease;
  z-index: 2;
}

.close-panel:hover {
  background: var(--error);
  color: white;
  border-color: var(--error);
  transform: rotate(90deg);
}

.copy-toast {
  position: absolute; bottom: -1.8rem; left: 50%; transform: translateX(-50%) translateY(5px);
  background: var(--neon-green); color: var(--bg-deep); font-size: .75rem; font-weight: 700;
  padding: .3rem .8rem; border-radius: 100px; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: all .3s ease;
}
.copy-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============ MAIN CONTAINER ============ */
.main-container {
  position: relative;
  z-index: 10;
  max-width: 500px;
  margin: 4rem auto;
  padding: 0 1.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(40px); }
  to { opacity: 1; transform: translateY(0); }
}

.top-logo {
  margin-bottom: 2rem;
  animation: fadeIn 0.8s ease-out 0.5s both;
}

.top-logo-img {
  height: 50px;
  width: auto;
  filter: brightness(1.1);
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ============ CARD ============ */
.card {
  background: var(--bg-card);
  backdrop-filter: blur(30px);
  border: 1px solid var(--border-glass);
  border-radius: 24px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
  animation: cardEnter 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
  width: 100%;
}

@keyframes cardEnter {
  from { opacity: 0; transform: scale(0.95) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.5), transparent);
}

/* Plant decorations */
.card-plants {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.plant-decoration {
  position: absolute;
  opacity: 0.15;
}

.plant-left {
  left: -15px;
  bottom: -15px;
  width: 130px;
  height: 150px;
}

.plant-right {
  right: -15px;
  top: -15px;
  width: 120px;
  height: 140px;
  transform: scaleX(-1);
}

.plant-bottom {
  left: 50%;
  bottom: -20px;
  transform: translateX(-50%);
  width: 100px;
  height: 120px;
  opacity: 0.1;
}

.plant-top {
  right: 20%;
  top: -10px;
  width: 90px;
  height: 110px;
  opacity: 0.1;
  transform: scaleX(-1);
}

.plant-stem {
  stroke: var(--neon-green);
  stroke-width: 2;
  fill: none;
  stroke-dasharray: 300;
  stroke-dashoffset: 300;
  animation: drawStem 2s ease-out 0.8s forwards;
}

@keyframes drawStem { to { stroke-dashoffset: 0; } }

.plant-leaf {
  fill: var(--neon-green);
  opacity: 0;
  transform-origin: center;
  animation: leafGrow 0.6s ease-out forwards;
}

.plant-leaf:nth-child(2) { animation-delay: 1.2s; }
.plant-leaf:nth-child(3) { animation-delay: 1.6s; }
.plant-leaf:nth-child(4) { animation-delay: 2s; }

@keyframes leafGrow {
  from { opacity: 0; transform: scale(0) rotate(-20deg); }
  to { opacity: 0.6; transform: scale(1) rotate(0); }
}

/* ============ SUCCESS CONTENT ============ */
.success-content {
  padding: 3rem 2.5rem;
  text-align: center;
  position: relative;
  z-index: 2;
}

.success-icon-wrapper {
  position: relative;
  width: 100px;
  height: 100px;
  margin: 0 auto 2rem;
}

.success-icon {
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 200, 83, 0.2));
  border: 2px solid rgba(0, 255, 136, 0.4);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: successBounce 1s cubic-bezier(0.16, 1, 0.3, 1) 0.8s both;
  position: relative;
  z-index: 2;
}

@keyframes successBounce {
  0% { transform: scale(0) rotate(-180deg); opacity: 0; }
  60% { transform: scale(1.1) rotate(10deg); }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

.success-icon svg {
  width: 50px;
  height: 50px;
  stroke: var(--neon-green);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  stroke-dasharray: 100;
  stroke-dashoffset: 100;
  animation: drawCheck 0.8s ease-out 1.2s forwards;
}

@keyframes drawCheck { to { stroke-dashoffset: 0; } }

.success-ripple {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: rgba(0, 255, 136, 0.3);
  animation: ripple 2s ease-out infinite;
}

.success-ripple:nth-child(2) { animation-delay: 0.5s; }
.success-ripple:nth-child(3) { animation-delay: 1s; }

@keyframes ripple {
  0% { transform: scale(1); opacity: 0.5; }
  100% { transform: scale(2.5); opacity: 0; }
}

.success-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 2rem;
  font-weight: 700;
  margin-bottom: 1rem;
  color: var(--text-primary);
  animation: fadeInUp 0.8s ease-out 1s both;
}

.success-subtitle {
  font-size: 1rem;
  color: var(--text-muted);
  margin-bottom: 2.5rem;
  line-height: 1.6;
  animation: fadeInUp 0.8s ease-out 1.2s both;
}

.success-subtitle strong {
  color: var(--neon-green);
  font-weight: 600;
}

.btn-portal {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.7rem;
  width: 100%;
  padding: 1rem 2rem;
  background: linear-gradient(135deg, #00e676, #00c853);
  color: #052010;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 10px 30px rgba(0, 230, 118, 0.3);
  animation: fadeInUp 0.8s ease-out 1.4s both;
  text-decoration: none;
}

.btn-portal:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 40px rgba(0, 230, 118, 0.5);
}

.btn-portal svg {
  width: 18px;
  height: 18px;
  transition: transform 0.3s ease;
}

.btn-portal:hover svg { transform: translateX(-4px); }

/* ============ CONFETTI ============ */
.confetti-container {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1500;
  overflow: hidden;
}

.confetti-piece {
  position: absolute;
  top: -20px;
  animation: confettiFall 3s ease-in forwards;
}

@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg) scale(0.5); opacity: 0; }
}

/* ============ FOOTER ============ */
footer {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 2rem 1rem 3rem;
  animation: fadeIn 1s ease-out 1.5s both;
}

.brand-name {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  letter-spacing: 4px;
  font-size: 0.85rem;
  background: linear-gradient(135deg, var(--text-muted), var(--neon-green));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ============ RESPONSIVE ============ */
@media (max-width: 768px) {
  header { padding: 0.9rem 1rem; }
  .logo-img { height: 36px; }
  
  .support-btn {
    padding: 0.5rem 0.85rem;
    font-size: 0.8rem;
    gap: 0.4rem;
    min-width: 0;
  }
  
  .support-btn svg { width: 14px; height: 14px; }
  
  .support-panel { right: 1rem; left: 1rem; width: auto; top: 80px; }
  
  .main-container {
    margin: 3rem auto;
    padding: 0 1rem;
  }
  
  .top-logo-img { height: 42px; }
  
  .success-content {
    padding: 2.5rem 1.5rem;
  }
  
  .success-title { font-size: 1.7rem; }
  .success-subtitle { font-size: 0.95rem; }
}

@media (max-width: 400px) {
  .success-title { font-size: 1.5rem; }
  .success-content { padding: 2rem 1.2rem; }
  .support-btn { padding: 0.45rem 0.7rem; font-size: 0.75rem; }
}
</style>
</head>
<body>

<div class="bg-aurora">
  <div class="aurora-blob"></div>
  <div class="aurora-blob"></div>
  <div class="aurora-blob"></div>
  <div class="aurora-blob"></div>
</div>

<div class="grid-overlay"></div>
<div class="fireflies" id="fireflies"></div>

<header>
  <div class="header-content">
    <div class="logo-container">
      <div class="logo-glow"></div>
      <img id="logoImg" alt="SynergiaBIO" style="display:block;margin:0 auto;height:46px;width:auto;max-width:100%;filter:brightness(1.1);">
    </div>
    <button class="support-btn" id="supportBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>Contacto</span>
    </button>
  </div>
</header>

<div class="support-overlay" id="supportOverlay"></div>
<div class="support-panel" id="supportPanel">
  <button class="close-panel" id="closePanel">✕</button>
  <div class="support-panel-header">
    <div class="icon-circle">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#052010" stroke-width="2.5" stroke-linecap="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </div>

<script>
// Fireflies
function createFireflies() {
  const container = document.getElementById('fireflies');
  const colors = ['#00ff88', '#00d4ff', '#a855f7', '#ffd700'];
  for (let i = 0; i < 15; i++) {
    const firefly = document.createElement('div');
    firefly.className = 'firefly';
    const size = Math.random() * 3 + 2;
    firefly.style.width = size + 'px';
    firefly.style.height = size + 'px';
    firefly.style.left = Math.random() * 100 + '%';
    firefly.style.top = Math.random() * 100 + '%';
    firefly.style.animationDuration = (Math.random() * 15 + 10) + 's';
    firefly.style.animationDelay = Math.random() * 10 + 's';
    const color = colors[Math.floor(Math.random() * colors.length)];
    firefly.style.background = color;
    firefly.style.boxShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
    container.appendChild(firefly);
  }
}
createFireflies();

// Support panel
const supportBtn = document.getElementById('supportBtn');
const supportPanel = document.getElementById('supportPanel');
const supportOverlay = document.getElementById('supportOverlay');
const closePanel = document.getElementById('closePanel');

supportBtn.addEventListener('click', () => {
  supportPanel.classList.add('active');
  supportOverlay.classList.add('active');
});

closePanel.addEventListener('click', () => {
  supportPanel.classList.remove('active');
  supportOverlay.classList.remove('active');
});

supportOverlay.addEventListener('click', () => {
  supportPanel.classList.remove('active');
  supportOverlay.classList.remove('active');
});

// Copy email
const copyBtn = document.getElementById('copyEmailBtn');
const copyToast = document.getElementById('copyToast');
if (copyBtn) {
  function doCopy() {
    var email = 'jose.valdes@synergiabio.com';
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(email).then(function() { showToast(); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = email; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); showToast(); } catch(e) {}
      document.body.removeChild(ta);
    }
  }
  function showToast() {
    copyToast.classList.add('show');
    setTimeout(function() { copyToast.classList.remove('show'); }, 1800);
  }
  copyBtn.addEventListener('click', doCopy);
  copyBtn.addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doCopy(); } });
}

// Confetti
function launchConfetti() {
  const container = document.getElementById('confettiContainer');
  container.innerHTML = '';
  const colors = ['#00e676', '#00c853', '#00ff88', '#00d4ff', '#a855f7', '#ffd700', '#ffffff'];
  for (let i = 0; i < 80; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti-piece';
    confetti.style.left = Math.random() * 100 + '%';
    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.animationDelay = Math.random() * 1.5 + 's';
    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
    const size = Math.random() * 8 + 4;
    confetti.style.width = size + 'px';
    confetti.style.height = size + 'px';
    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    confetti.style.boxShadow = `0 0 10px ${confetti.style.background}`;
    container.appendChild(confetti);
  }
  setTimeout(() => { container.innerHTML = ''; }, 5000);
}
