<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SynergiaBIO · Soporte Técnico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root {
  --bg-deep: #060a14;
  --bg-mid: #0d1220;
  --bg-card: rgba(255, 255, 255, 0.04);
  --border-glass: rgba(255, 255, 255, 0.08);
  --neon-green: #00ff88;
  --neon-cyan: #00d4ff;
  --neon-pink: #ff6b9d;
  --neon-gold: #ffd700;
  --neon-purple: #a855f7;
  --text-primary: #ffffff;
  --text-muted: #8b95a8;
  --text-dim: #5a6478;
  --success: #00ff88;
  --error: #ff4757;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  animation: bodyUnlock 3.4s ease-in-out forwards;
}
body.loaded { overflow: auto; animation: none; }
@keyframes bodyUnlock {
  0%, 68% { overflow: hidden; }
  100% { overflow: auto; overflow-x: hidden; }
}

/* ============ INTRO OVERLAY ============ */
.intro-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--bg-deep);
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.6s ease, visibility 0.6s ease;
  animation: overlayAutoHide 3.4s ease-in-out forwards;
}
.intro-overlay.fade-out { opacity: 0; visibility: hidden; pointer-events: none; animation: none; }
@keyframes overlayAutoHide {
  0%, 68% { opacity: 1; visibility: visible; pointer-events: auto; }
  100% { opacity: 0; visibility: hidden; pointer-events: none; }
}
.intro-ball {
  width: 50px; height: 50px;
  background: radial-gradient(circle at 30% 30%, #7dffb3, #00ff88 40%, #00c853 100%);
  border-radius: 50%;
  box-shadow: 0 0 30px rgba(0,255,136,.6), 0 0 60px rgba(0,255,136,.4), 0 0 100px rgba(0,255,136,.2), inset -5px -5px 15px rgba(0,100,50,.4), inset 5px 5px 15px rgba(255,255,255,.3);
  position: absolute; top: -80px;
  animation: ballDrop 2.2s cubic-bezier(.4,0,.2,1) forwards;
}
.intro-ball::before {
  content: ''; position: absolute; top: 15%; left: 20%; width: 30%; height: 20%;
  background: rgba(255,255,255,.6); border-radius: 50%; filter: blur(2px);
}
@keyframes ballDrop {
  0% { top: -80px; transform: scale(.5) rotate(0); opacity: 0; }
  10% { opacity: 1; }
  55% { top: calc(50% - 25px); transform: scale(1) rotate(180deg); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  65% { top: calc(50% - 35px); transform: scale(1.1) rotate(200deg); }
  75% { top: calc(50% - 25px); transform: scale(.95) rotate(210deg); }
  85% { top: calc(50% - 28px); transform: scale(1.02) rotate(215deg); }
  95% { top: calc(50% - 25px); transform: scale(1) rotate(220deg); }
  100% { top: calc(50% - 25px); transform: scale(1) rotate(220deg); opacity: 1; }
}
.intro-ripple {
  position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,255,136,.6), transparent 70%);
  transform: translate(-50%,-50%) scale(0); opacity: 0;
  animation: rippleExpand .8s ease-out 1.4s forwards;
}
@keyframes rippleExpand { 0% { transform: translate(-50%,-50%) scale(0); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(15); opacity: 0; } }
.intro-ripple-2 { animation-delay: 1.6s; animation-duration: 1s; }
.intro-text {
  position: absolute; top: calc(50% + 60px); left: 50%; transform: translateX(-50%);
  font-family: 'Space Grotesk', sans-serif; font-size: .9rem; font-weight: 600;
  letter-spacing: 3px; color: var(--neon-green); opacity: 0;
  animation: textFadeIn .5s ease-out 1.2s forwards;
}
@keyframes textFadeIn { from { opacity: 0; transform: translate(-50%,10px); } to { opacity: 1; transform: translate(-50%,0); } }

/* ============ ANIMATED BACKGROUND ============ */
.bg-aurora {
  position: fixed; inset: 0; z-index: 0; overflow: hidden;
  background: radial-gradient(ellipse at top, #0d1220 0%, #060a14 100%);
}
.aurora-blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .5; animation: blobFloat 20s ease-in-out infinite; }
.aurora-blob:nth-child(1) { width: 500px; height: 500px; background: radial-gradient(circle,#00ff88 0%,transparent 70%); top: -10%; left: -10%; animation-duration: 25s; }
.aurora-blob:nth-child(2) { width: 600px; height: 600px; background: radial-gradient(circle,#00d4ff 0%,transparent 70%); top: 40%; right: -15%; animation-duration: 30s; animation-delay: -5s; }
.aurora-blob:nth-child(3) { width: 450px; height: 450px; background: radial-gradient(circle,#a855f7 0%,transparent 70%); bottom: -10%; left: 30%; animation-duration: 22s; animation-delay: -10s; }
.aurora-blob:nth-child(4) { width: 400px; height: 400px; background: radial-gradient(circle,#ff6b9d 0%,transparent 70%); top: 20%; left: 50%; animation-duration: 28s; animation-delay: -15s; opacity: .3; }
@keyframes blobFloat { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(50px,-30px) scale(1.1); } 66% { transform: translate(-30px,40px) scale(.95); } }
.grid-overlay {
  position: fixed; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px), linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
  background-size: 60px 60px; z-index: 1; pointer-events: none;
  mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
}
.fireflies { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
.firefly {
  position: absolute; width: 4px; height: 4px; background: var(--neon-green); border-radius: 50%;
  box-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-green);
  animation: fireflyFloat 15s ease-in-out infinite;
}
.firefly::after { content: ''; position: absolute; inset: -4px; background: inherit; border-radius: 50%; opacity: .3; filter: blur(4px); }
@keyframes fireflyFloat { 0%,100% { transform: translate(0,0); opacity: 0; } 10%,90% { opacity: 1; } 25% { transform: translate(100px,-150px); } 50% { transform: translate(-80px,-300px); } 75% { transform: translate(150px,-200px); } }

/* ============ HEADER ============ */
header {
  position: relative; z-index: 100; padding: 1.2rem 2rem;
  backdrop-filter: blur(20px); background: rgba(6,10,20,.6);
  border-bottom: 1px solid var(--border-glass);
  animation: slideDown .8s cubic-bezier(.16,1,.3,1);
}
@keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } }
.header-content { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.logo-container { display: flex; align-items: center; gap: .8rem; position: relative; }
.logo-img { height: 46px; width: auto; filter: brightness(1.1); transition: transform .3s ease; }
.logo-img:hover { transform: scale(1.05); }
.logo-glow {
  position: absolute; width: 220px; height: 90px;
  background: radial-gradient(ellipse, rgba(0,255,136,.2), transparent 70%);
  filter: blur(20px); pointer-events: none;
  animation: logoPulse 3s ease-in-out infinite;
  left: 50%; top: 50%; transform: translate(-50%,-50%);
}
@keyframes logoPulse { 0%,100% { opacity: .5; transform: translate(-50%,-50%) scale(1); } 50% { opacity: .9; transform: translate(-50%,-50%) scale(1.15); } }

/* Support button with nudge */
.support-btn {
  display: flex; align-items: center; gap: .5rem;
  padding: .55rem 1.1rem;
  background: linear-gradient(135deg, rgba(0,255,136,.15), rgba(0,212,255,.15));
  border: 1px solid rgba(0,255,136,.3); border-radius: 100px;
  color: var(--neon-green); font-weight: 600; font-size: .88rem;
  cursor: pointer; transition: all .4s cubic-bezier(.16,1,.3,1);
  position: relative; overflow: hidden; font-family: inherit; white-space: nowrap; flex-shrink: 0;
  animation: gentleNudge 2s ease-in-out infinite;
}
@keyframes gentleNudge { 0%,85%,100% { transform: translateX(0); } 88% { transform: translateX(2px); } 91% { transform: translateX(-2px); } 94% { transform: translateX(1.5px); } 97% { transform: translateX(-1px); } }
.support-btn::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
  opacity: 0; transition: opacity .4s ease; z-index: 0;
}
.support-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,255,136,.3); border-color: var(--neon-green); color: var(--bg-deep); animation: none; }
.support-btn:hover::before { opacity: 1; }
.support-btn svg, .support-btn span { position: relative; z-index: 1; }
.support-btn svg { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }

/* ============ SUPPORT PANEL ============ */
.support-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(8px); z-index: 1000; opacity: 0; visibility: hidden; transition: all .4s ease; }
.support-overlay.active { opacity: 1; visibility: visible; }
.support-panel {
  position: fixed; top: 100px; right: 2rem; width: 340px;
  background: rgba(13,18,32,.95); backdrop-filter: blur(30px);
  border: 1px solid var(--border-glass); border-radius: 24px; padding: 1.8rem;
  z-index: 1001; transform: translateY(-20px) scale(.95); opacity: 0; visibility: hidden;
  transition: all .5s cubic-bezier(.16,1,.3,1); box-shadow: 0 30px 80px rgba(0,0,0,.5);
}
.support-panel::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan), var(--neon-purple)); border-radius: 24px 24px 0 0; }
.support-panel.active { transform: translateY(0) scale(1); opacity: 1; visibility: visible; }
.support-panel-header { display: flex; align-items: center; gap: .8rem; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-glass); }
.support-panel-header .icon-circle { width: 44px; height: 44px; background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan)); border-radius: 14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,255,136,.3); animation: iconPulse 2s ease-in-out infinite; }
@keyframes iconPulse { 0%,100% { box-shadow: 0 8px 20px rgba(0,255,136,.3); } 50% { box-shadow: 0 8px 30px rgba(0,255,136,.6); } }
.support-panel-header h3 { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; font-weight: 700; background: linear-gradient(135deg, var(--text-primary), var(--neon-green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.contact-item { display: flex; align-items: center; gap: 1rem; padding: 1rem; margin-bottom: .7rem; background: rgba(255,255,255,.03); border: 1px solid var(--border-glass); border-radius: 14px; text-decoration: none; color: inherit; transition: all .3s ease; animation: slideIn .5s ease-out both; }
.contact-item:nth-child(1) { animation-delay: .1s; }
.contact-item:nth-child(2) { animation-delay: .2s; }
@keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
.contact-item:hover { background: rgba(0,255,136,.08); border-color: rgba(0,255,136,.3); transform: translateX(5px); }
.contact-icon { width: 42px; height: 42px; background: linear-gradient(135deg, rgba(0,255,136,.2), rgba(0,212,255,.2)); border: 1px solid rgba(0,255,136,.3); border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .3s ease; }
.contact-item:hover .contact-icon { transform: rotate(8deg) scale(1.1); background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan)); }
.contact-icon svg { width: 20px; height: 20px; stroke: var(--neon-green); transition: stroke .3s ease; }
.contact-item:hover .contact-icon svg { stroke: var(--bg-deep); }
.contact-info { flex: 1; min-width: 0; }
.contact-label { font-size: .7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: .2rem; }
.contact-value { font-size: .9rem; color: var(--text-primary); font-weight: 600; word-break: break-all; }
.close-panel { position: absolute; top: 1rem; right: 1rem; width: 32px; height: 32px; background: rgba(255,255,255,.05); border: 1px solid var(--border-glass); border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 1rem; transition: all .3s ease; z-index: 2; }
.close-panel:hover { background: var(--error); color: white; border-color: var(--error); transform: rotate(90deg); }
.copy-toast {
  position: absolute; bottom: -1.8rem; left: 50%; transform: translateX(-50%) translateY(5px);
  background: var(--neon-green); color: var(--bg-deep); font-size: .75rem; font-weight: 700;
  padding: .3rem .8rem; border-radius: 100px; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: all .3s ease;
}
.copy-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============ FOOTER ============= */
footer { position: relative; z-index: 10; text-align: center; padding: 2rem 1rem 3rem; animation: fadeIn 1s ease-out 1.2s both; }
.footer-badges { display: flex; justify-content: center; gap: .8rem; margin-bottom: 1rem; flex-wrap: wrap; }
.badge { display: flex; align-items: center; gap: .4rem; padding: .5rem 1rem; background: rgba(255,255,255,.03); border: 1px solid var(--border-glass); border-radius: 100px; color: var(--text-muted); font-weight: 500; font-size: .8rem; transition: all .3s ease; }
.badge:hover { background: rgba(0,255,136,.08); border-color: rgba(0,255,136,.3); color: var(--neon-green); transform: translateY(-2px); }
.badge-icon { width: 14px; height: 14px; stroke: var(--neon-green); }
.brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: 4px; font-size: .85rem; background: linear-gradient(135deg, var(--text-muted), var(--neon-green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ============ MAIN CONTAINER ============ */
.main-container { position: relative; z-index: 10; max-width: 720px; margin: 3rem auto; padding: 0 1.5rem; animation: fadeInUp 1s cubic-bezier(.16,1,.3,1) .3s both; }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

/* ============ CARD ============ */
.card { background: var(--bg-card); backdrop-filter: blur(30px); border: 1px solid var(--border-glass); border-radius: 28px; overflow: hidden; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,.4); }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(0,255,136,.5), transparent); }

/* ============ CARD HEADER ============ */
.card-header { position: relative; padding: 3rem 2rem 2.5rem; text-align: center; overflow: hidden; background: linear-gradient(180deg, rgba(0,255,136,.05) 0%, transparent 100%); }
.card-header-bg { position: absolute; inset: 0; overflow: hidden; }
.plant-decoration { position: absolute; opacity: .18; }
.plant-left { left: -20px; bottom: -20px; width: 180px; height: 200px; }
.plant-right { right: -20px; top: -20px; width: 160px; height: 180px; transform: scaleX(-1); }
.plant-stem { stroke: var(--neon-green); stroke-width: 2; fill: none; stroke-dasharray: 300; stroke-dashoffset: 300; animation: drawStem 2s ease-out forwards; }
@keyframes drawStem { to { stroke-dashoffset: 0; } }
.plant-leaf { fill: var(--neon-green); opacity: 0; transform-origin: center; animation: leafGrow .6s ease-out forwards; }
.plant-leaf:nth-child(2) { animation-delay: .8s; }
.plant-leaf:nth-child(3) { animation-delay: 1.2s; }
.plant-leaf:nth-child(4) { animation-delay: 1.6s; }
@keyframes leafGrow { from { opacity: 0; transform: scale(0) rotate(-20deg); } to { opacity: .6; transform: scale(1) rotate(0); } }
.card-header-content { position: relative; z-index: 2; }
.card-header .tag { display: inline-flex; align-items: center; gap: .5rem; padding: .4rem 1rem; background: rgba(0,255,136,.1); border: 1px solid rgba(0,255,136,.3); border-radius: 100px; color: var(--neon-green); font-size: .75rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 1.2rem; animation: fadeIn .6s ease-out .5s both; }
.tag-dot { width: 6px; height: 6px; background: var(--neon-green); border-radius: 50%; box-shadow: 0 0 10px var(--neon-green); animation: dotPulse 1.5s ease-in-out infinite; }
@keyframes dotPulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(1.3); } }
.card-header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 3.2rem; font-weight: 700; line-height: 1.1; margin-bottom: .8rem; background: linear-gradient(135deg, #ffffff 0%, #00ff88 50%, #00d4ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: titleReveal 1s cubic-bezier(.16,1,.3,1) .6s both; letter-spacing: -1px; }
@keyframes titleReveal { from { opacity: 0; transform: translateY(20px); filter: blur(10px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
.card-header .subtitle { font-size: 1.1rem; color: var(--text-muted); font-weight: 400; line-height: 1.5; animation: fadeIn .8s ease-out .8s both; }
.float-badges { position: absolute; inset: 0; pointer-events: none; }
.float-badge { position: absolute; padding: .5rem .9rem; background: rgba(255,255,255,.05); backdrop-filter: blur(10px); border: 1px solid var(--border-glass); border-radius: 100px; font-size: .75rem; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: .4rem; animation: floatBadge 6s ease-in-out infinite; }
.float-badge:nth-child(1) { top: 20%; left: 5%; animation-delay: 0s; }
.float-badge:nth-child(2) { top: 35%; right: 5%; animation-delay: 2s; }
.float-badge:nth-child(3) { bottom: 20%; left: 8%; animation-delay: 4s; }
@keyframes floatBadge { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-10px) rotate(2deg); } }

/* ============ FORM ============ */
.form-container { padding: 2rem; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
.form-group { margin-bottom: 1rem; position: relative; animation: fadeInUp .6s ease-out both; }
.form-group:nth-child(1) { animation-delay: .4s; }
.form-group:nth-child(2) { animation-delay: .5s; }
.form-group:nth-child(3) { animation-delay: .6s; }
.form-group:nth-child(4) { animation-delay: .7s; }
label { display: flex; align-items: center; gap: .5rem; color: var(--text-muted); font-weight: 600; font-size: .75rem; margin-bottom: .5rem; text-transform: uppercase; letter-spacing: 1.5px; }
.label-icon { width: 14px; height: 14px; stroke: var(--neon-green); }
.input-wrapper { position: relative; }
input, textarea { width: 100%; padding: .95rem 1.1rem; background: rgba(255,255,255,.03); border: 1px solid var(--border-glass); border-radius: 12px; color: var(--text-primary); font-size: .95rem; font-family: inherit; transition: all .3s cubic-bezier(.16,1,.3,1); outline: none; }
input::placeholder, textarea::placeholder { color: var(--text-dim); }
input:focus, textarea:focus { background: rgba(0,255,136,.05); border-color: var(--neon-green); box-shadow: 0 0 0 4px rgba(0,255,136,.1), 0 0 30px rgba(0,255,136,.15); transform: translateY(-2px); }
textarea { resize: vertical; min-height: 100px; font-family: inherit; }
.input-glow { position: absolute; inset: 0; border-radius: 12px; pointer-events: none; opacity: 0; transition: opacity .3s ease; background: radial-gradient(circle at var(--x,50%) var(--y,50%), rgba(0,255,136,.3), transparent 50%); }
input:focus ~ .input-glow, textarea:focus ~ .input-glow { opacity: 1; }
.error-message { color: var(--error); font-size: .8rem; margin-top: .4rem; display: none; font-weight: 500; animation: shake .4s ease; }
.error-message.show { display: block; }
input.error, textarea.error { border-color: var(--error); animation: shake .4s ease; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.submit-btn { width: 100%; padding: 1.1rem; margin-top: .5rem; background: linear-gradient(135deg, #00e676 0%, #00c853 50%, #00ff88 100%); color: #052010; border: none; border-radius: 14px; font-size: 1.05rem; font-weight: 800; font-family: inherit; cursor: pointer; transition: all .4s cubic-bezier(.16,1,.3,1); display: flex; align-items: center; justify-content: center; gap: .7rem; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,230,118,.4), 0 0 0 1px rgba(0,255,136,.3) inset; animation: fadeInUp .6s ease-out .8s both; letter-spacing: .5px; text-shadow: 0 1px 2px rgba(255,255,255,.2); }
.submit-btn::before { content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0; background: rgba(255,255,255,.3); border-radius: 50%; transform: translate(-50%,-50%); transition: width .6s ease, height .6s ease; }
.submit-btn:hover::before { width: 400px; height: 400px; }
.submit-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 45px rgba(0,230,118,.6), 0 0 0 1px rgba(0,255,136,.5) inset; background: linear-gradient(135deg, #00ff88 0%, #00e676 50%, #00c853 100%); }
.submit-btn:active { transform: translateY(-1px); }
.submit-btn:disabled { opacity: .7; cursor: not-allowed; }
.btn-icon { width: 18px; height: 18px; position: relative; z-index: 1; transition: transform .3s ease; stroke: #052010; }
.submit-btn:hover .btn-icon { transform: translateX(4px) rotate(-10deg); }
.btn-text { position: relative; z-index: 1; }
.spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(5,32,16,.3); border-top-color: #052010; border-radius: 50%; animation: spin .8s linear infinite; position: relative; z-index: 1; }
@keyframes spin { to { transform: rotate(360deg); } }

/* hidden fields */
.hf { display: none !important; }

@media (max-width: 768px) {
  header { padding: .9rem 1rem; }

// Intro animation - robust multi-trigger dismissal
(function() {
  var o = document.getElementById('introOverlay');
  var done = false;
  function dismiss() {
    if (done) return; done = true;
    o.classList.add('fade-out');
    document.body.classList.add('loaded');
    setTimeout(function() { o.style.display = 'none'; }, 700);
  }
  if (document.readyState === 'complete') {
    setTimeout(dismiss, 2400);
  } else {
    window.addEventListener('load', function() { setTimeout(dismiss, 2400); });
  }
  setTimeout(dismiss, 5000);
})();

// Fireflies
(function() {
  var c = document.getElementById('fireflies');
  var colors = ['#00ff88','#00d4ff','#a855f7','#ffd700'];
  for (var i = 0; i < 15; i++) {
    var f = document.createElement('div'); f.className = 'firefly';
    var s = Math.random() * 3 + 2;
    f.style.width = s + 'px'; f.style.height = s + 'px';
    f.style.left = Math.random() * 100 + '%'; f.style.top = Math.random() * 100 + '%';
    f.style.animationDuration = (Math.random() * 15 + 10) + 's';
    f.style.animationDelay = Math.random() * 10 + 's';
    var col = colors[Math.floor(Math.random() * colors.length)];
    f.style.background = col; f.style.boxShadow = '0 0 10px ' + col + ', 0 0 20px ' + col;
    c.appendChild(f);
  }
})();

// Input glow
 document.querySelectorAll('input, textarea').forEach(function(input) {
  input.addEventListener('mousemove', function(e) {
    var rect = input.getBoundingClientRect();
    var x = ((e.clientX - rect.left) / rect.width) * 100;
    var y = ((e.clientY - rect.top) / rect.height) * 100;
    var glow = input.parentElement.querySelector('.input-glow');
    if (glow) { glow.style.setProperty('--x', x + '%'); glow.style.setProperty('--y', y + '%'); }
  });
});

var copyBtn = document.getElementById('copyEmailBtn');
var copyToast = document.getElementById('copyToast');
if (copyBtn) {
  function showToast() {
    copyToast.classList.add('show');
    setTimeout(function() { copyToast.classList.remove('show'); }, 1800);
  }
  function doCopy() {
    var email = 'jose.valdes@synergiabio.com';
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(email).then(showToast);
    } else {
      var ta = document.createElement('textarea');
      ta.value = email; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); showToast(); } catch(e) {}
      document.body.removeChild(ta);
    }
  }
  copyBtn.addEventListener('click', doCopy);
  copyBtn.addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doCopy(); } });
}
